# MANAGED BY ANSIBLE — ansible/templates/feeds.yml.j2
# Local edits are overwritten on the next deploy. Change `blog_feeds` and the
# cost-control vars in ansible/deploy.yml (or -e on the command line) instead.
#
# RSS sources the curator polls each run.
#   fetch  — how many entries to pull from this feed
#   weight — ranking multiplier, clamped to [0.85, 1.30]. It breaks ties between
#            comparably relevant stories; it must not lift an irrelevant one to
#            the top. Hacker News is deliberately the LOWEST: it is a noisy
#            general feed and carries the most off-topic material.
feeds:
  - name: IEEE Spectrum
    url: https://spectrum.ieee.org/feeds/feed.rss
    weight: 1.2
    fetch: 15
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    weight: 1.15
    fetch: 15
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 1.1
    fetch: 18
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    weight: 1.0
    fetch: 15
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    weight: 0.95
    fetch: 18
  - name: Hacker News Best
    url: https://hnrss.org/best
    weight: 0.95
    fetch: 20
  - name: Hacker News
    url: https://hnrss.org/frontpage?points=150
    weight: 0.85
    fetch: 20

settings:
  # Summarizer backend: none | ollama | anthropic
  #   none      feed's own <description>. No model, no key, $0. DEFAULT.
  #   ollama    local model on the Docker host. Free, self-hosted.
  #   anthropic claude-haiku-4-5 via the Batch API (half price).
  # Ranking and selection are deterministic in all three — see curator/ranker.py.
  summarizer: none
  # Max articles any single feed may contribute to one run.
  per_source_cap: 3
  # Apply this project's extra noise patterns (listicles, deals, Ask HN) on top
  # of the ported list. The ported list alone is tuned for LWN/vendor feeds.
  extra_noise_filter: true
  # Max candidate articles handed to Claude in one run — the input-token driver.
  max_candidates: 40
  # How many stories Claude is asked to publish per run — the output-token driver.
  publish_count: 5
  # Keep at most this many posts on the site; oldest are pruned.
  max_posts: 60
  # Skip anything older than this many hours.
  max_age_hours: 36
