# RSS sources the curator polls each run.
# `weight` nudges how many candidates are taken from each feed.
feeds:
  - name: Hacker News
    url: https://hnrss.org/frontpage?points=150
    weight: 3
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    weight: 2
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    weight: 2
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    weight: 2
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    weight: 1
  - name: Hacker News Best
    url: https://hnrss.org/best
    weight: 2
  - name: IEEE Spectrum
    url: https://spectrum.ieee.org/feeds/feed.rss
    weight: 1

settings:
  # Max candidate articles handed to Claude in one run.
  max_candidates: 40
  # How many stories Claude is asked to publish per run.
  publish_count: 5
  # Keep at most this many posts on the site; oldest are pruned.
  max_posts: 60
  # Skip anything older than this many hours.
  max_age_hours: 36
