name: Build and deploy to Pages

# The homelab pushes CONTENT (Markdown). This workflow is the only thing that
# builds and publishes, so the site is reproducible from a clone and the homelab
# is not a single point of failure for the published artifact.
# Every third-party action is pinned to a full commit SHA with the version in a
# trailing comment. A floating tag is an unreviewed dependency that holds write
# access to the deployment — `pages: write` and `id-token: write` here.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it. A cron push landing mid-deploy
# should wait, not abort a half-finished publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Show what is being published
        run: |
          echo "posts: $(find site/src/content/posts -name '*.md' | wc -l)"
          find site/src/content/posts -name '*.md' -printf '  %f\n' | sort | head -20

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify the build output
        run: |
          test -s site/dist/index.html || { echo "::error::dist/index.html missing or empty"; exit 1; }
          test -s site/dist/rss.xml    || { echo "::error::rss.xml missing"; exit 1; }
          test -s site/dist/CNAME      || { echo "::error::CNAME missing — custom domain would break"; exit 1; }
          echo "index.html $(stat -c%s site/dist/index.html) bytes"
          echo "CNAME       $(cat site/dist/CNAME)"
          echo "post pages  $(find site/dist/posts -name index.html | wc -l)"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
