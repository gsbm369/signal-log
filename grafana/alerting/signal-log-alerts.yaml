# Grafana unified-alerting provisioning for signal.log.
#
# Mount at /etc/grafana/provisioning/alerting/ , or apply through the API with
#   ansible-playbook deploy.yml -e grafana_user=admin -e grafana_password=... --tags alert
#
# Replace LOKI_DATASOURCE_UID if applying this file by hand; the Ansible task
# looks the UID up automatically.
#
# What it watches: ABSENCE, not failure.
#
# Everything else in this project catches loud failures — a build that breaks, a
# push that is rejected, a workflow that times out. A curator that simply dies
# produces none of those. It produces nothing at all, and an alert keyed on an
# error state cannot see that. This rule counts SUCCESSES and fires when the
# count reaches zero, so silence and failure are the same signal.
#
# `exit_code = 0` alone is not enough — a cycle can build cleanly, find nothing
# new, and be a perfectly healthy no-op. deploy_status "ok" (deployed) and
# "not_needed" (nothing new, feeds fine) both count; every failure mode and
# deliberately-skipped runs do not.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: signal-log-email
    receivers:
      - uid: signal-log-email
        type: email
        settings:
          # Delivered via the Postfix relay already configured on the host
          # (GF_SMTP_HOST=host.docker.internal:25).
          addresses: nikita@gs-bm.com
          singleEmail: true
          subject: '[signal.log] {{ .CommonLabels.alertname }}'

groups:
  - orgId: 1
    name: signal-log
    folder: signal.log
    interval: 10m
    rules:
      - uid: signal-log-stalled
        title: signal.log has not published in 48h
        condition: THRESHOLD
        for: 30m
        # No data means the curator is not reporting at all, which is worse
        # than a failed cycle, not better.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No successful signal.log cycle reached production in the last 48 hours.
          description: >-
            The curator either stopped running, or every cycle in the window failed
            to build, push, or deploy. Check the cycle log on the homelab
            (~/ai-blog/logs/cycle.log), the Actions run history, and the
            "signal.log — curator" dashboard.
          runbook_url: https://github.com/gsbm369/signal-log#failure-behaviour
        labels:
          service: signal-log
          severity: warning
        notification_settings:
          receiver: signal-log-email
        data:
          - refId: QUERY
            relativeTimeRange: { from: 172800, to: 0 }   # 48h
            datasourceUid: LOKI_DATASOURCE_UID
            model:
              refId: QUERY
              datasource: { type: loki, uid: LOKI_DATASOURCE_UID }
              editorMode: code
              queryType: instant
              # `or vector(0)` is load-bearing. Without it, total silence returns an
              # EMPTY result and the rule depends on noDataState to notice. With it,
              # silence evaluates to 0 and trips the threshold directly — verified
              # against a job label carrying no records at all.
              #
              # Keyed on deploy_status rather than the derived reached_production
              # boolean, so it reads correctly against records written before that
              # field was tightened. "skipped" (SKIP_PUSH) is excluded: a run that
              # chose not to publish is not evidence that publishing works.
              expr: >-
                sum(count_over_time({job="signal-log"} | json
                    | exit_code = 0 | deploy_status =~ "ok|not_needed" [48h])) or vector(0)

          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: QUERY
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [QUERY] }
                  reducer: { type: last, params: [] }
