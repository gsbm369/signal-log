---
# Deploys signal.log: ensures config, builds images, brings nginx up, publishes,
# installs the cron job, and optionally registers the site with Nginx Proxy Manager.
#
# Idempotent: a second consecutive run reports changed=0.
#
#   ansible-playbook deploy.yml
#   ansible-playbook deploy.yml -e force_cycle=true          # publish now
#   ansible-playbook deploy.yml -e cycle_hours=2 --tags cron
#   ansible-playbook deploy.yml -e blog_hostname=blog.example.com -e npm_email=... -e npm_password=...

- name: Deploy the AI tech blog
  hosts: blog
  gather_facts: true
  become: false

  vars:
    blog_root: "{{ lookup('env', 'HOME') }}/ai-blog"
    blog_port: 8080

    # Portability: the uid/gid that owns the bind mounts. Defaults to the
    # deploying user rather than a hardcoded 1000.
    blog_uid: "{{ ansible_user_uid }}"
    blog_gid: "{{ ansible_user_gid }}"

    # Shared docker network that NPM and Loki sit on.
    proxy_network: proxy-stack_proxy-net

    # Observability
    loki_url: "http://loki:3100"          # from inside the container network
    loki_url_host: "http://127.0.0.1:3100" # from the host, for cron-side skip records
    loki_job: signal-log

    # Cost control
    cycle_hours: 6              # how often the curator runs
    cron_minute: 17
    max_candidates: 40          # articles sent to the model per run (cost driver)
    publish_count: 5            # articles summarised and published per run
    # TEMPORARILY RAISED from 60 while the home page still points at the old
    # four categories. The pruner now sorts by addedAt, which makes the legacy
    # posts the oldest-added items in the store and therefore first out — and
    # they are the only posts the current index.astro can render. At 60, one
    # 39-post cycle would take the last seven and leave the hero empty.
    #
    # 200 buys roughly four cycles (~24h) at the observed 39 posts per run.
    # PUT THIS BACK TO 60 once index.astro reads the seven live categories;
    # holding 200 posts is not a decision, it is a stay of execution.
    max_posts: 200
    per_source_cap: 3           # one prolific feed cannot dominate a run

    # ----------------------------------------------------------------------- #
    # SCORING POLICY, PER CATEGORY
    # ----------------------------------------------------------------------- #
    #
    # The old single `max_age_hours: 72` did two jobs at once and has been split.
    #
    #   ingest_days      is now an INGEST WINDOW ONLY — "how far back do we
    #                    bother parsing". It is NOT a freshness policy. It still
    #                    carries the catch-up property the 72h value existed for:
    #                    this guest runs on a desktop the owner switches off, so
    #                    multi-day gaps are the operating reality, not a fault,
    #                    and at 36h a weekend outage silently dropped every story
    #                    published while the machine was off.
    #
    #   half_life_hours  now carries ALL editorial freshness. This is the fix
    #                    that matters: a single global 36h curve cannot express
    #                    an engineering newsletter. Measured 2026-09-10, the
    #                    newest item on each evergreen feed was jvns 51.8d,
    #                    Brendan Gregg 216.2d, Marc Brooker 43.8d, Netflix 13.1d.
    #                    At a 36h half-life a 216-day post scores 2^(-144) — not
    #                    low, indistinguishable from zero. Those four sources
    #                    could never have appeared, and the page would have
    #                    looked like they were broken rather than out-ranked.
    #
    # Decay demotes; the window deletes. Anything you want the page to be able
    # to reach on a slow day belongs inside the window with a slow curve, never
    # outside it.
    #
    # aggregators 18h is the one number not taken from the brief. The
    # hand-edited `max_age_hours: 36` was reaching for "nothing much past a day
    # and a half"; as a HARD cutoff that deletes, as a curve it has to be
    # tighter to bite. At 18h a 36h-old link scores 0.25 and a 72h-old one 0.06,
    # which is the same editorial result without discarding the outage
    # catch-up.
    scoring_categories:
      system_design: { half_life_hours: 168,  ingest_days: 730,  retention_days: 45,   cap: 6 }
      company_eng:   { half_life_hours: 336,  ingest_days: 730,  retention_days: 365,  cap: 6 }
      # 30d, not 3d. MEASURED on the first run with the new config: at a 3-day
      # window the Kubernetes Blog contributed 2 of its 15 entries and 13 were
      # rejected as too_old — it posts weekly, so a news-shaped window deletes
      # almost all of it. The 72h half-life still demotes a fortnight-old item to
      # 2^(-4.6); the window's job is only to let it be seen at all.
      devops_linux:  { half_life_hours: 72,   ingest_days: 30,   retention_days: 45,   cap: 6 }
      deep_dives:    { half_life_hours: 4320, ingest_days: 3650, retention_days: null, cap: 6 }
      aggregators:   { half_life_hours: 18,   ingest_days: 3,    retention_days: 45,   cap: 6 }
      # 30d for the same reason: TechCrunch Fintech returned 0 candidates at 3
      # days — all 15 of its entries were older than the window, so the source
      # was silently contributing nothing whatsoever.
      fintech:       { half_life_hours: 72,   ingest_days: 30,   retention_days: 45,   cap: 6 }
      # 14d: GameFromScratch surfaced 3 of 12 at a 3-day window.
      gaming:        { half_life_hours: 72,   ingest_days: 14,   retention_days: 45,   cap: 6 }
    extra_noise_filter: true    # listicle/deals/AskHN patterns on top of the ported list

    # Summarizer backend: none | ollama | anthropic.
    # `none` is the default: no model, no API key, no spend. Selection is
    # deterministic in every mode, so switching backends changes prose only.
    summarizer_backend: none
    # Only consulted when summarizer_backend is anthropic. Haiku, not Opus:
    # "summarise a blurb in three sentences" does not need a frontier model,
    # and the Batch API halves it again.
    curator_model: claude-haiku-4-5
    ollama_url: "http://ollama:11434"
    ollama_model: "llama3.2:3b"

    # Rendered to curator/feeds.yml via templates/feeds.yml.j2. Templated rather
    # than regex-edited so nesting changes cannot write to the wrong place.
    # weight is the ranking multiplier, band [0.85, 1.30]. fetch is the pull
    # quota. Hacker News sits at the floor: highest volume, most off-topic.
    # weight is the ranking multiplier, band [0.85, 1.30]. fetch is the pull
    # quota. category is DECLARED PER FEED and never inferred from the text —
    # see the note below. Hacker News sits at the weight floor: highest volume,
    # most off-topic.
    #
    # CATEGORY COMES FROM THE FEED, NEVER FROM KEYWORDS. A gaming site covering
    # NVIDIA earnings is gaming; a markets site covering a game studio is
    # markets. Keyword classification gets both wrong, and guessing would
    # contradict the only claim this site makes about itself — that nothing
    # about what appears is decided by a model or a heuristic over the prose.
    # ----------------------------------------------------------------------- #
    # SOURCES
    # ----------------------------------------------------------------------- #
    #
    # READ THE WEIGHTS — THEY ARE THE EDITORIAL POLICY, NOT A QUALITY RANKING.
    # The spread inside a category is a statement about what this publication is:
    #
    #   Stripe 0.95, Plaid 0.90   how payment systems are actually built
    #   Finextra 0.75             industry news about payments
    #   Game Developer 0.95       engine internals, postmortems, graphics
    #   Eurogamer 0.60            a game got a release date
    #
    # Both halves are wanted; a page of pure engine internals would be dry. But
    # this is an engineering newsletter, so depth outranks announcements, and the
    # weight is where that belief lives. Do NOT flatten these to equal values —
    # the split IS the feature.
    #
    # The band is [0.60, 1.30] (ranker.SOURCE_WEIGHT_MIN/MAX), widened downwards
    # from 0.85 for exactly this. At the old floor, 0.60 and 0.70 both clamped to
    # 0.85 and the policy above was silently deleted.
    #
    # half_life_hours / ingest_days on a SOURCE override its category. Cadence
    # and subject are independent: Marc Brooker writes system_design at a
    # deep_dives rhythm. Overriding the curve without also widening the window
    # does nothing — the item is dropped at fetch time before the curve is read.
    blog_feeds:
      # ---- system_design ----
      - { name: ByteByteGo,         url: "https://blog.bytebytego.com/feed",              category: system_design, weight: 0.95, fetch: 15 }
      - { name: InfoQ,              url: "https://feed.infoq.com/",                       category: system_design, weight: 0.85, fetch: 20 }
      - { name: Pragmatic Engineer, url: "https://blog.pragmaticengineer.com/rss/",       category: system_design, weight: 0.90, fetch: 15 }
      # Measured newest post 43.8 days old on 2026-09-10 — evergreen cadence in a
      # news-cadence category. Stays in system_design because his SUBJECT is
      # correct; moving him to deep_dives would also hand him that category's
      # retention_days: null, which is a different decision.
      - { name: Marc Brooker,       url: "https://brooker.co.za/blog/rss.xml",            category: system_design, weight: 0.95, fetch: 40, half_life_hours: 4320 }

      # ---- company_eng ----
      - { name: Cloudflare,         url: "https://blog.cloudflare.com/rss/",              category: company_eng,   weight: 0.95, fetch: 15 }
      - { name: Netflix Tech,       url: "https://netflixtechblog.com/feed",              category: company_eng,   weight: 0.90, fetch: 10 }
      - { name: AWS Architecture,   url: "https://aws.amazon.com/blogs/architecture/feed/", category: company_eng, weight: 0.85, fetch: 15 }
      - { name: Discord Eng,        url: "https://discord.com/blog/rss.xml",              category: company_eng,   weight: 0.80, fetch: 10 }
      - { name: GitHub Eng,         url: "https://github.blog/engineering/feed/",         category: company_eng,   weight: 0.80, fetch: 15 }

      # ---- devops_linux ----
      - { name: Kubernetes Blog,    url: "https://kubernetes.io/feed.xml",                category: devops_linux,  weight: 0.90, fetch: 15 }
      - { name: LWN.net,            url: "https://lwn.net/headlines/newrss",              category: devops_linux,  weight: 0.95, fetch: 20 }

      # ---- deep_dives ----
      # fetch is raised here because depth is the whole point and the archives
      # differ wildly: Dan Luu exposes 128 items, jvns 20, Gregg 10.
      - { name: jvns.ca,            url: "https://jvns.ca/atom.xml",                      category: deep_dives,    weight: 1.00, fetch: 20 }
      - { name: Brendan Gregg,      url: "https://www.brendangregg.com/blog/rss.xml",     category: deep_dives,    weight: 1.00, fetch: 10 }
      - { name: Dan Luu,            url: "https://danluu.com/atom.xml",                   category: deep_dives,    weight: 0.95, fetch: 40 }
      - { name: The Changelog,      url: "https://changelog.com/feed",                    category: deep_dives,    weight: 0.75, fetch: 15 }

      # ---- aggregators ----
      - { name: Hacker News Best,   url: "https://hnrss.org/best",                        category: aggregators,   weight: 0.70, fetch: 25 }
      - { name: Lobsters,           url: "https://lobste.rs/rss",                         category: aggregators,   weight: 0.75, fetch: 25 }

      # ---- fintech ----
      # Stripe and Plaid write engineering, not headlines, and measured 21.8d and
      # slower. Inside fintech's 3-day window they would never be ingested, so
      # they carry BOTH overrides. This pairing is the reason ingest_days is
      # per-source and not only per-category.
      - { name: Stripe Blog,        url: "https://stripe.com/blog/feed.rss",              category: fintech,       weight: 0.95, fetch: 10, half_life_hours: 720, ingest_days: 365 }
      - { name: Plaid Blog,         url: "https://plaid.com/blog/rss.xml",                category: fintech,       weight: 0.90, fetch: 10, half_life_hours: 720, ingest_days: 365 }
      # Dates its scheduled webinars at air time — 11 of 54 items measured up to
      # 55.8 days in the FUTURE. Kept; the date-validity guard in
      # curate.entry_datetime() rejects them. That guard is not a content filter.
      # fetch 60, not 20. At 20 the future-date guard measured ZERO rejections
      # here — the webinar entries sit past index 20 in feed order, so the guard
      # was proven by unit test but never actually fired in production. 60
      # reaches them. per_source_cap still limits what Finextra contributes to a
      # published issue; this only changes what the gate gets to see.
      - { name: Finextra,           url: "https://www.finextra.com/rss/headlines.aspx",   category: fintech,       weight: 0.75, fetch: 60 }
      - { name: TechCrunch Fintech, url: "https://techcrunch.com/category/fintech/feed/", category: fintech,       weight: 0.70, fetch: 15 }

      # ---- gaming ----
      # The engine/tooling sources get a slower curve and a wider window than the
      # release-date sources sharing the category. A Game Developer graphics
      # postmortem is worth surfacing a fortnight later; a Eurogamer headline is
      # not.
      - { name: Game Developer,     url: "https://www.gamedeveloper.com/rss.xml",         category: gaming,        weight: 0.95, fetch: 25, half_life_hours: 336, ingest_days: 30 }
      - { name: Unity Blog,         url: "https://blog.unity.com/feed",                   category: gaming,        weight: 0.85, fetch: 15, half_life_hours: 336, ingest_days: 90 }
      - { name: Godot Engine,       url: "https://godotengine.org/rss.xml",               category: gaming,        weight: 0.85, fetch: 15, half_life_hours: 336, ingest_days: 90 }
      - { name: GameFromScratch,    url: "https://gamefromscratch.com/feed/",             category: gaming,        weight: 0.70, fetch: 12 }
      - { name: Polygon,            url: "https://www.polygon.com/rss/index.xml",         category: gaming,        weight: 0.65, fetch: 12 }
      - { name: Eurogamer,          url: "https://www.eurogamer.net/feed",                category: gaming,        weight: 0.60, fetch: 12 }
      - { name: Rock Paper Shotgun, url: "https://www.rockpapershotgun.com/feed",         category: gaming,        weight: 0.60, fetch: 12 }

      # REJECTED — do not re-add without re-testing. Reasons as MEASURED.
      #
      #   Measured 2026-09-10 for the newsletter pivot:
      #     High Scalability   http://highscalability.com/blog/rss.xml -> HTTP 404.
      #                        The https variant resolves but its newest item is
      #                        854 days old. Effectively dead. Marc Brooker
      #                        replaces it and is better on the same subject.
      #     Martin Kleppmann   HTTP 404
      #     Uber Engineering   HTTP 404
      #     Monzo Engineering  HTTP 404
      #     Coinbase Eng       HTTP 403 — blocks automated clients
      #     Fintech Futures    HTTP 404
      #     Wise Engineering   HTTP 200, newest item 568 days old. Abandoned.
      #
      #   Measured 2026-09-08 for the previous news taxonomy. Kept because the
      #   evidence is still the evidence, even though the categories are gone:
      #     Ynetnews           dates parse fine (5/5, no CDATA problem — there is
      #                        a regression test in test_feeds.py). The real
      #                        disqualifier is staleness: newest item 6.7 days.
      #     Jerusalem Post     EVIDENCE DID NOT REPRODUCE on
      #                        rssfeedsfrontpage.aspx — 26 entries, 5/5 dates
      #                        parsed, newest 0.4h. Live, not abandoned. Left out
      #                        because it was explicitly rejected, not because the
      #                        feed is bad. Re-test before deciding.
      #     Globes, Calcalist  zero items returned
      #     CNBC Business      newest items 60-74h old
      #     GameSpot           newest items 60-74h old
      #     AP News            HTTP 403

    # Publishing to GitHub Pages. The homelab pushes CONTENT; Actions builds.
    # The canonical hostname lives in site/public/CNAME and nowhere else.
    github_repo: gsbm369/signal-log
    github_branch: main
    alert_email: nikita@gs-bm.com

    # Weekly digest — reuses the host's existing Postfix relay.
    digest_enabled: true
    digest_to: nikita@gs-bm.com
    digest_from: "signal.log <alerts@gs-bm.com>"
    digest_smtp_host: "127.0.0.1"
    digest_smtp_port: 25
    digest_count: 10
    digest_days: 7
    digest_weekday: 0          # Sunday
    digest_hour: 8
    digest_minute: 30

    site_url: ""            # optional staging override; normally derived from CNAME
    keep_releases: 5

    force_cycle: false          # publish even if a release already exists
    compose: "docker compose --project-directory {{ blog_root }}"
    lockfile: /tmp/aiblog-cycle.lock

  tasks:

    # ---------------------------------------------------------------- checks
    - name: Verify the project directory exists
      ansible.builtin.stat:
        path: "{{ blog_root }}/docker-compose.yml"
      register: project_stat

    - name: Fail if the project is not present
      ansible.builtin.fail:
        msg: "No docker-compose.yml under {{ blog_root }} — is blog_root set correctly?"
      when: not project_stat.stat.exists

    # `command -v` is a shell builtin, so this needs the shell module.
    - name: Resolve the docker and flock binaries
      ansible.builtin.shell: "command -v {{ item }}"
      args: { executable: /bin/bash }
      loop: [docker, flock]
      register: bin_probe
      changed_when: false
      # `command -v` exits 1 when not found; the shell module fails on that by default.

    - name: Record the resolved binary paths
      ansible.builtin.set_fact:
        docker_bin: "{{ bin_probe.results[0].stdout | trim }}"
        flock_bin: "{{ bin_probe.results[1].stdout | trim }}"

    - name: Verify the Docker daemon is reachable
      ansible.builtin.command: "{{ docker_bin }} version"
      register: docker_version
      changed_when: false

    - name: Ensure runtime directories exist
      ansible.builtin.file:
        path: "{{ blog_root }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - logs
        - public_html
        - public_html/releases
        - curator/state
        - site/src/content/posts

    - name: Ensure the shared proxy network exists
      ansible.builtin.shell: |
        set -e
        if docker network inspect {{ proxy_network | quote }} >/dev/null 2>&1; then
          echo PRESENT
        else
          docker network create {{ proxy_network | quote }} >/dev/null
          echo CREATED
        fi
      args: { executable: /bin/bash }
      register: net_state
      changed_when: "'CREATED' in net_state.stdout"

    # ------------------------------------------------------------ config
    - name: Seed .env from the template when absent
      ansible.builtin.copy:
        src: "{{ blog_root }}/.env.example"
        dest: "{{ blog_root }}/.env"
        remote_src: true
        force: false
        mode: "0600"

    - name: Keep .env readable only by its owner
      ansible.builtin.file:
        path: "{{ blog_root }}/.env"
        mode: "0600"

    - name: Write deployment-managed settings into .env
      ansible.builtin.lineinfile:
        path: "{{ blog_root }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        state: present
        create: false
      loop:
        - { key: BLOG_UID,        value: "{{ blog_uid }}" }
        - { key: BLOG_GID,        value: "{{ blog_gid }}" }
        - { key: BLOG_PORT,       value: "{{ blog_port }}" }
        - { key: LOKI_URL,        value: "{{ loki_url }}" }
        - { key: LOKI_URL_HOST,   value: "{{ loki_url_host }}" }
        - { key: LOKI_JOB,        value: "{{ loki_job }}" }
        - { key: LOKI_HOST_LABEL, value: "{{ ansible_hostname }}" }
        - { key: PROXY_NETWORK,   value: "{{ proxy_network }}" }
        - { key: CURATOR_MODEL,      value: "{{ curator_model }}" }
        - { key: SUMMARIZER_BACKEND, value: "{{ summarizer_backend }}" }
        - { key: OLLAMA_URL,         value: "{{ ollama_url }}" }
        - { key: OLLAMA_MODEL,       value: "{{ ollama_model }}" }
        - { key: KEEP_RELEASES,   value: "{{ keep_releases }}" }
        - { key: DOCKER_BIN,      value: "{{ docker_bin }}" }
        - { key: FLOCK_BIN,       value: "{{ flock_bin }}" }
        - { key: LOCK_FILE,       value: "{{ lockfile }}" }
        - { key: GITHUB_REPO,     value: "{{ github_repo }}" }
        - { key: GITHUB_BRANCH,   value: "{{ github_branch }}" }
        - { key: DIGEST_TO,        value: "{{ digest_to }}" }
        - { key: DIGEST_FROM,      value: "{{ digest_from }}" }
        - { key: DIGEST_SMTP_HOST, value: "{{ digest_smtp_host }}" }
        - { key: DIGEST_SMTP_PORT, value: "{{ digest_smtp_port }}" }
        - { key: DIGEST_COUNT,     value: "{{ digest_count }}" }
        - { key: DIGEST_DAYS,      value: "{{ digest_days }}" }
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Render curator/feeds.yml from template
      ansible.builtin.template:
        src: templates/feeds.yml.j2
        dest: "{{ blog_root }}/curator/feeds.yml"
        mode: "0644"

    - name: Read the canonical hostname from site/public/CNAME
      ansible.builtin.slurp:
        src: "{{ blog_root }}/site/public/CNAME"
      register: cname_raw
      failed_when: false

    - name: Settle the effective site URL
      ansible.builtin.set_fact:
        site_url: >-
          {{ site_url if site_url | length > 0
             else ('https://' ~ (cname_raw.content | b64decode | trim))
                  if (cname_raw.content is defined and (cname_raw.content | b64decode | trim) | length > 0)
                  else 'http://localhost:' ~ blog_port }}

    - name: Check whether an API key is configured
      ansible.builtin.shell: |
        grep -qE '^ANTHROPIC_API_KEY=.+' {{ blog_root }}/.env && echo yes || echo no
      args: { executable: /bin/bash }
      register: api_key_probe
      changed_when: false
      no_log: true

    - name: Record API key state
      ansible.builtin.set_fact:
        api_key_set: "{{ api_key_probe.stdout | trim == 'yes' }}"

    # ---------------------------------------------------------------- build
    # Rebuild only when something in the build context actually changed.
    - name: Hash the build inputs
      ansible.builtin.shell: |
        set -o pipefail
        find docker scripts curator site/src site/package.json site/package-lock.json \
             site/astro.config.mjs site/tsconfig.json -type f \
             ! -path 'curator/state/*' -print0 2>/dev/null \
          | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
      args:
        chdir: "{{ blog_root }}"
        executable: /bin/bash
      register: ctx_hash
      changed_when: false

    - name: Read the last built context hash
      ansible.builtin.slurp:
        src: "{{ blog_root }}/curator/state/.image-context-hash"
      register: prev_hash_raw
      failed_when: false

    - name: Confirm the builder image still exists
      ansible.builtin.command: docker image inspect aiblog-builder:latest
      register: image_present
      changed_when: false
      failed_when: false

    - name: Decide whether a rebuild is needed
      ansible.builtin.set_fact:
        needs_build: >-
          {{ image_present.rc != 0
             or (prev_hash_raw.content | default('') | b64decode | trim) != ctx_hash.stdout | trim }}

    - name: Build the builder image
      ansible.builtin.command: "{{ compose }} build builder"
      args:
        chdir: "{{ blog_root }}"
      when: needs_build | bool
      changed_when: true
      tags: [build]

    - name: Record the built context hash
      ansible.builtin.copy:
        content: "{{ ctx_hash.stdout | trim }}\n"
        dest: "{{ blog_root }}/curator/state/.image-context-hash"
        mode: "0644"
      when: needs_build | bool
      tags: [build]

    - name: Ensure the nginx image is present
      community.docker.docker_image:
        name: nginx:1.27-alpine
        source: pull
        force_source: false
        state: present
      tags: [build]

    # ---------------------------------------------------------------- serve
    - name: Bootstrap a placeholder release so nginx has a root on first deploy
      ansible.builtin.shell: |
        set -e
        cd {{ blog_root }}/public_html
        if [ ! -e current ]; then
          mkdir -p releases/bootstrap
          printf '<!doctype html><title>signal.log</title><p>First build in progress.</p>\n' \
            > releases/bootstrap/index.html
          ln -sfn releases/bootstrap current
          echo CREATED
        else
          echo PRESENT
        fi
      args: { executable: /bin/bash }
      register: bootstrap
      changed_when: "'CREATED' in bootstrap.stdout"

    - name: Start the web container
      community.docker.docker_compose_v2:
        project_src: "{{ blog_root }}"
        services: [web]
        state: present
      register: up_result
      tags: [deploy]

    # ---------------------------------------------------------- publish cycle
    # follow:false is load-bearing. With follow:true the module stats the TARGET,
    # so stat.lnk_target is never populated and stat.path just echoes the path we
    # asked about — the bootstrap test could never match and a clean deploy would
    # serve the placeholder forever while the play exited green.
    - name: Check whether the site has ever really been published
      ansible.builtin.stat:
        path: "{{ blog_root }}/public_html/current"
        follow: false
      register: current_release

    - name: Decide whether to run a publish cycle
      ansible.builtin.set_fact:
        do_cycle: >-
          {{ force_cycle | bool
             or not current_release.stat.exists
             or not (current_release.stat.islnk | default(false))
             or (current_release.stat.lnk_target | default('')) is search('bootstrap') }}

    - name: Show the publish-cycle decision
      ansible.builtin.debug:
        msg: >-
          current -> {{ current_release.stat.lnk_target | default('(absent)') }}
          | do_cycle = {{ do_cycle }}
          {{ '(placeholder detected — publishing)' if (current_release.stat.lnk_target | default('')) is search('bootstrap')
             else ('(forced)' if force_cycle | bool else '(already published)') }}

    - name: Run a publish cycle (curate -> build -> validate -> publish)
      ansible.builtin.command: "{{ compose }} run --rm builder"
      args:
        chdir: "{{ blog_root }}"
      register: cycle
      changed_when: true
      when: do_cycle | bool
      tags: [cycle]

    - name: Show the cycle result
      ansible.builtin.debug:
        msg: >-
          {{ (cycle.stdout_lines | default([]) + cycle.stderr_lines | default([]))
             | select('search', 'METRIC|published|FATAL|cycle finished') | list }}
      when: do_cycle | bool
      tags: [cycle]

    # ----------------------------------------------------------------- cron
    # SCHEDULING RUNS ON systemd TIMERS, NOT cron.
    #
    # This guest lives on a memory-constrained Hyper-V host and was suspended for
    # 20+ hours straight, costing every publish window in that period. Vixie cron
    # fires on wall-clock minutes: after a resume it waits for the next matching
    # minute and the elapsed windows are gone, silently. A timer with
    # Persistent=true records its last run and fires immediately on resume, so a
    # suspended VM costs one delayed cycle instead of all of them.
    - name: Enable lingering so user timers run without a login session
      ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
      args:
        creates: "/var/lib/systemd/linger/{{ ansible_user_id }}"
      tags: [cron, timer]

    - name: Install the systemd user units
      ansible.builtin.copy:
        src: "{{ blog_root }}/systemd/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ item }}"
        remote_src: true
        mode: "0644"
      loop:
        - signal-log-cycle.service
        - signal-log-cycle.timer
        - signal-log-digest.service
        - signal-log-digest.timer
      register: units
      tags: [cron, timer]

    - name: Reload the user systemd manager
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      when: units.changed
      tags: [cron, timer]

    - name: Enable and start the timers
      ansible.builtin.systemd_service:
        scope: user
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - signal-log-cycle.timer
        - signal-log-digest.timer
      tags: [cron, timer]

    # Superseded by the timers above. Removed rather than left to double-fire.
    - name: Remove the superseded cron entries
      ansible.builtin.cron:
        name: "{{ item }}"
        user: "{{ ansible_user_id }}"
        state: absent
      loop:
        - "signal.log — curate feeds and rebuild the site"
        - "signal.log — weekly digest email"
      tags: [cron, timer]

    - name: Install nightly log rotation for the cycle log
      ansible.builtin.cron:
        name: "signal.log — trim cycle log"
        user: "{{ ansible_user_id }}"
        minute: "5"
        hour: "4"
        job: "tail -n 2000 {{ blog_root }}/logs/cycle.log > {{ blog_root }}/logs/cycle.log.tmp && mv {{ blog_root }}/logs/cycle.log.tmp {{ blog_root }}/logs/cycle.log"
        state: present
      tags: [cron]

    # ------------------------------------------------- reverse proxy (opt-in)
    # A conditional dynamic include is not covered by --syntax-check, so verify
    # the file exists before relying on it.
    - name: Confirm the proxy-host task file is present
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/tasks/npm_proxy_host.yml"
      register: npm_task_file
      when: blog_hostname is defined
      tags: [proxy]

    - name: Fail clearly if the proxy-host task file is missing
      ansible.builtin.fail:
        msg: >-
          blog_hostname is set but {{ playbook_dir }}/tasks/npm_proxy_host.yml does not
          exist. Restore it from git (ansible/tasks/npm_proxy_host.yml) or unset
          blog_hostname to skip reverse-proxy registration.
      when:
        - blog_hostname is defined
        - not (npm_task_file.stat.exists | default(false))
      tags: [proxy]

    - name: Warn when a public hostname is set but site_url still points at localhost
      ansible.builtin.fail:
        msg: >-
          blog_hostname is {{ blog_hostname }} but site_url is {{ site_url }}.
          RSS links are generated from site_url, so the published feed would contain
          unusable localhost URLs. Pass -e site_url=https://{{ blog_hostname }} (and
          the cycle will rebuild the feed).
      when:
        - blog_hostname is defined
        - site_url is search('localhost|127\\.0\\.0\\.1')
      tags: [proxy]

    - name: Register the site with Nginx Proxy Manager
      ansible.builtin.include_tasks:
        file: tasks/npm_proxy_host.yml
        apply:
          tags: [proxy]
      when:
        - blog_hostname is defined
        - npm_email is defined
        - npm_password is defined
      tags: [proxy]

    # ------------------------------------------------- alerting (opt-in)
    # `apply` is required: tasks inside a dynamic include do NOT inherit the
    # include's tags, so `--tags alert` would include the file and run nothing.
    - name: Provision the Grafana alert
      ansible.builtin.include_tasks:
        file: tasks/grafana_alert.yml
        apply:
          tags: [alert]
      when: (grafana_user is defined and grafana_password is defined) or grafana_token is defined
      tags: [alert]

    # ---------------------------------------------------------------- verify
    - name: Wait for the site to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ blog_port }}/"
        status_code: 200
        return_content: true
      register: probe
      retries: 12
      delay: 5
      until: probe.status == 200
      changed_when: false
      tags: [verify]

    # A 200 is not proof of a deploy: the bootstrap placeholder also returns 200.
    - name: Assert the served page is the real site, not the bootstrap placeholder
      ansible.builtin.assert:
        that:
          - "'First build in progress' not in probe.content"
          - "'signal.log' in probe.content"
          - probe.content | length > 2000
        success_msg: "Served page is a real build ({{ probe.content | length }} bytes)."
        fail_msg: >-
          The site is still serving the bootstrap placeholder
          ({{ probe.content | length }} bytes). The publish cycle did not run or did
          not succeed — re-run with -e force_cycle=true and check logs/cycle.log.
      tags: [verify]

    - name: Verify the RSS feed
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ blog_port }}/rss.xml"
        status_code: 200
        return_content: true
      register: feed
      changed_when: false
      failed_when: "'<rss' not in feed.content"
      tags: [verify]

    - name: Count published posts
      ansible.builtin.find:
        paths: "{{ blog_root }}/site/src/content/posts"
        patterns: "*.md"
      register: posts
      tags: [verify]

    - name: Read the last cycle metrics
      ansible.builtin.slurp:
        src: "{{ blog_root }}/curator/state/metrics.json"
      register: metrics_raw
      failed_when: false
      tags: [verify]

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "Site                : http://{{ ansible_default_ipv4.address | default('127.0.0.1') }}:{{ blog_port }}/  (HTTP {{ probe.status }})"
          - "Public hostname     : {{ blog_hostname | default('not configured — LAN only') }}"
          - "RSS                 : {{ site_url }}/rss.xml  ({{ feed.content | regex_findall('<item>') | length }} item(s))"
          - >-
            {{ '*** WARNING: site_url is ' ~ site_url ~ ' — every link in the published feed is
            unusable by an external consumer. Re-deploy with -e site_url=https://<public-host>
            -e force_cycle=true once the hostname is decided. ***'
            if site_url is search('localhost|127\\.0\\.0\\.1')
            else 'Feed URLs           : absolute, rooted at ' ~ site_url }}
          - "Posts published     : {{ posts.matched }}"
          - "Curation schedule   : systemd timer, every {{ cycle_hours }}h at :{{ '%02d' | format(cron_minute | int) }} (Persistent=true — replays windows missed while suspended)"
          - "Summarizer          : {{ summarizer_backend }}{{ ' (' ~ curator_model ~ ', Batch API)' if summarizer_backend == 'anthropic' else (' (' ~ ollama_model ~ ')' if summarizer_backend == 'ollama' else ' — feed descriptions, no model, $0') }}"
          - "Selection           : deterministic ranker, no model in any mode"
          - "Volume caps         : <= {{ max_candidates }} candidates, {{ publish_count }} published, {{ per_source_cap }} per source"
          - "Last run metrics    : {{ (metrics_raw.content | default('') | b64decode | from_json) if metrics_raw.content is defined else 'none yet' }}"
          - "Weekly digest       : {{ ('Sunday %02d:%02d -> ' ~ digest_to ~ ' via ' ~ digest_smtp_host ~ ':' ~ digest_smtp_port) | format(digest_hour | int, digest_minute | int) if digest_enabled | bool else 'disabled' }}"
          - "Logs                : {{ blog_root }}/logs/cycle.log  +  Loki job={{ loki_job }}"
          - >-
            {{ ('API key configured  : ' ~ ('yes' if api_key_set else 'NO — required for summarizer_backend=anthropic'))
               if summarizer_backend == 'anthropic'
               else 'API key             : not required by the ' ~ summarizer_backend ~ ' backend' }}
      tags: [verify]
