---
# Applies the signal.log alert to Grafana through its provisioning API.
#
# Required: grafana_user, grafana_password  (or grafana_token)
# Optional: grafana_url (default http://127.0.0.1:3000), alert_email
#
# Idempotent: contact point and rule are addressed by fixed UIDs, so re-applying
# updates in place. It does NOT touch the notification policy tree — the rule
# routes straight to its own contact point via notification_settings, so an
# existing homelab alerting setup is left completely alone.

- name: Set Grafana API auth header
  ansible.builtin.set_fact:
    _gf_url: "{{ grafana_url | default('http://127.0.0.1:3000') }}"
    _gf_headers: >-
      {{ {'Authorization': 'Bearer ' ~ grafana_token} if grafana_token is defined
         else {'Authorization': 'Basic ' ~ (grafana_user ~ ':' ~ grafana_password) | b64encode} }}
  no_log: true

- name: Find the Loki datasource
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/datasources"
    headers: "{{ _gf_headers }}"
    status_code: 200
  register: gf_ds
  changed_when: false
  no_log: true

- name: Extract the Loki datasource UID
  ansible.builtin.set_fact:
    loki_uid: >-
      {{ (gf_ds.json | selectattr('type', 'equalto', 'loki') | list | first | default({})).uid | default('') }}

- name: Fail if no Loki datasource is configured
  ansible.builtin.fail:
    msg: >-
      No Loki datasource found in Grafana. Add one pointing at
      {{ loki_url | default('http://loki:3100') }} before provisioning the alert.
  when: loki_uid | length == 0

- name: Report the datasource
  ansible.builtin.debug:
    msg: "Loki datasource uid = {{ loki_uid }}"

- name: Create or update the contact point
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/v1/provisioning/contact-points"
    method: POST
    headers: "{{ _gf_headers | combine({'X-Disable-Provenance': 'true'}) }}"
    body_format: json
    body:
      uid: signal-log-email
      name: signal-log-email
      type: email
      settings:
        addresses: "{{ alert_email | default('nikita@gs-bm.com') }}"
        singleEmail: true
      disableResolveMessage: false
    status_code: [200, 201, 202, 409]
  register: gf_cp
  changed_when: gf_cp.status in [200, 201, 202]
  no_log: true

# The rules cannot be created before their folder exists — Grafana returns
# "invalid alert rule: folder does not exist" rather than creating it.
- name: Ensure the alert folder exists
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/folders"
    method: POST
    headers: "{{ _gf_headers }}"
    body_format: json
    body:
      uid: "{{ grafana_folder_uid | default('signal-log') }}"
      title: "{{ grafana_folder_title | default('signal.log') }}"
    status_code: [200, 201, 409, 412]
  register: gf_folder
  changed_when: gf_folder.status in [200, 201]
  no_log: true

- name: Report the folder
  ansible.builtin.debug:
    msg: >-
      Folder '{{ grafana_folder_uid | default('signal-log') }}'
      {{ 'created' if gf_folder.status in [200, 201] else 'already present' }}

- name: Load the alert rule definitions
  ansible.builtin.set_fact:
    alert_rule: "{{ lookup('file', playbook_dir ~ '/../grafana/alerting/signal-log-alerts.yaml') | from_yaml }}"

# Two tiers: 12h warning (two consecutive cycles missed) and 48h critical
# (backstop). If the critical ever fires without the warning having fired first,
# that is a bug in the alerting, not only in the pipeline.
# Does the rule already exist? PUT on this endpoint is update-only and returns
# 404 for a rule that has never been created, so create and update are different
# calls and the choice has to be made per rule.
- name: Check which alert rules already exist
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/v1/provisioning/alert-rules/{{ item.uid }}"
    method: GET
    headers: "{{ _gf_headers }}"
    status_code: [200, 404]
  loop: "{{ alert_rule.groups[0].rules }}"
  loop_control:
    label: "{{ item.uid }}"
  register: gf_existing
  changed_when: false
  no_log: true

- name: Create alert rules that do not exist yet
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/v1/provisioning/alert-rules"
    method: POST
    headers: "{{ _gf_headers | combine({'X-Disable-Provenance': 'true'}) }}"
    body_format: json
    body: >-
      {{ (item.item | combine({'ruleGroup': alert_rule.groups[0].name,
                               'folderUID': grafana_folder_uid | default('signal-log'),
                               'orgID': 1}))
         | to_json | replace('LOKI_DATASOURCE_UID', loki_uid) | from_json }}
    status_code: [200, 201, 202]
  loop: "{{ gf_existing.results }}"
  loop_control:
    label: "{{ item.item.uid }} ({{ item.item.labels.severity }})"
  when: item.status == 404
  register: gf_created
  changed_when: true

- name: Update alert rules that already exist
  ansible.builtin.uri:
    url: "{{ _gf_url }}/api/v1/provisioning/alert-rules/{{ item.item.uid }}"
    method: PUT
    headers: "{{ _gf_headers | combine({'X-Disable-Provenance': 'true'}) }}"
    body_format: json
    body: >-
      {{ (item.item | combine({'ruleGroup': alert_rule.groups[0].name,
                               'folderUID': grafana_folder_uid | default('signal-log'),
                               'orgID': 1}))
         | to_json | replace('LOKI_DATASOURCE_UID', loki_uid) | from_json }}
    status_code: [200, 201, 202]
  loop: "{{ gf_existing.results }}"
  loop_control:
    label: "{{ item.item.uid }} ({{ item.item.labels.severity }})"
  when: item.status == 200
  register: gf_rule
  # An existing rule with identical content is not a change.
  changed_when: false

- name: Report the alert state
  ansible.builtin.debug:
    msg: >-
      {{ alert_rule.groups[0].rules | map(attribute='uid') | list | join(', ')
         ~ ' -> ' ~ (alert_email | default('nikita@gs-bm.com'))
         ~ '  (created: ' ~ (gf_created.results | default([]) | rejectattr('skipped', 'defined') | list | length)
         ~ ', already present: ' ~ (gf_rule.results | default([]) | rejectattr('skipped', 'defined') | list | length) ~ ')' }}
